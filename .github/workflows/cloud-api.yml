name: Cloud API CI/CD

# The cloud API imports the whole loci/ package transitively (spatial/,
# temporal/, retrieval/, schema, payload_filters), and the Fly image vendors
# loci/ at build time — so any library change must re-test AND re-deploy,
# not just changes to the five files the old filter listed.
on:
  push:
    branches:
      - main
    paths:
      - "cloud/**"
      - "loci/**"
      - "pyproject.toml"
      - ".github/workflows/cloud-api.yml"
  pull_request:
    paths:
      - "cloud/**"
      - "loci/**"
      - "pyproject.toml"
      - ".github/workflows/cloud-api.yml"

permissions:
  contents: read

jobs:
  # Deploy gates on this job, so it must catch everything a bad loci/ change
  # can break: the cloud API suite alone is not enough — a library regression
  # that passes cloud/tests but fails the library suite must never auto-deploy.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install -r cloud/api/requirements.txt

      - name: Run cloud API tests
        env:
          QDRANT_URL: "http://localhost:6333"
          QDRANT_API_KEY: "ci-dummy"
          DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
          LOCI_VECTOR_SIZE: "4"
          LOCI_DEV_MODE: "true"
          PYTHONPATH: "${{ github.workspace }}/cloud/api"
        run: pytest cloud/tests -v --tb=short

      - name: Run library test suite
        run: pytest tests/ -v --tb=short

      - name: Lint
        run: ruff check loci/ cloud/

      - name: Type-check
        run: mypy loci/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Only deploy on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up flyctl
        # SHA-pinned (was @master): this job holds the prod deploy token, so a
        # mutable ref would mean trust-on-every-run of a third-party repo.
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-04-08

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config cloud/fly.toml
