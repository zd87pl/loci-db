name: Cloud deploy

# LOCI Cloud Worker (cloud/workers). Every push to main that touches it deploys to staging;
# production is deployed only by hand (Actions → Cloud deploy → Run workflow → production) and
# waits for a reviewer of the GitHub "production" environment. Both jobs skip with a notice
# until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set as repository secrets.
on:
  push:
    branches: [main]
    paths:
      - "cloud/workers/**"
      - ".github/workflows/cloud-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: cloud-deploy-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/workers/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  staging:
    needs: test
    if: github.event_name == 'push' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/workers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that staging can be deployed
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; staging deploy skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then
            echo "::notice::env.staging has no D1 database id yet (wrangler d1 create loci-control-staging); staging deploy skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/workers/package-lock.json
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
      - if: steps.ready.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply loci-control-staging --remote --env staging
      - if: steps.ready.outputs.ok == 'true'
        run: npx wrangler deploy --env staging --var "GIT_SHA:${GITHUB_SHA}"
      - if: steps.ready.outputs.ok == 'true'
        name: Health check
        run: curl -fsS -A "loci-cloud-deploy/1" "https://loci-cloud-staging.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN || 'zd-66b' }}.workers.dev/health"

  production:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production # add a required reviewer in Settings → Environments
    defaults:
      run:
        working-directory: cloud/workers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that production can be deployed
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; production deploy skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/workers/package-lock.json
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
      - if: steps.ready.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply loci-control --remote
      - if: steps.ready.outputs.ok == 'true'
        run: npx wrangler deploy --var "GIT_SHA:${GITHUB_SHA}"
      - if: steps.ready.outputs.ok == 'true'
        name: Health check
        run: curl -fsS -A "loci-cloud-deploy/1" "https://loci-cloud.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN || 'zd-66b' }}.workers.dev/health"
