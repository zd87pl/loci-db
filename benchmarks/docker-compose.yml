# Qdrant has no authentication in this stack, so both ports bind to
# 127.0.0.1 on purpose (mirrors the root docker-compose.yml): binding
# 0.0.0.0 would let any LAN peer read, write, or wipe the benchmark data —
# Qdrant's admin API included. The image tag is pinned so benchmark runs are
# reproducible across machines.
services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

volumes:
  qdrant_data:
