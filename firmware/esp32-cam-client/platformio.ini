; LOCI ESP32 thin-client firmware — camera frames out, spoken answers in.
;
; Pick the environment that matches the board on your desk:
;   pio run -e xiao_esp32s3_sense -t upload -t monitor
;   pio run -e esp32cam           -t upload -t monitor   (AI-Thinker ESP32-CAM, needs a USB-serial adapter)
;   pio run -e freenove_esp32s3   -t upload -t monitor
;
; Wi-Fi credentials and the host URL live in include/secrets.h (git-ignored);
; copy include/secrets.h.example and fill it in. Pin maps are in include/board_config.h
; and every pin can be overridden with -D flags here, e.g. -DLOCI_I2S_DOUT=3.

[platformio]
default_envs = xiao_esp32s3_sense
description = LOCI spatial-memory thin client: ESP32 camera + speaker (+ mic) streaming to a host

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; frames per second the board aims for (the host may ask for slower via next_ms)
    -DLOCI_FPS=2
    ; FRAMESIZE_QVGA (320x240) | FRAMESIZE_VGA (640x480) | FRAMESIZE_SVGA (800x600)
    -DLOCI_FRAME_SIZE=FRAMESIZE_VGA
    ; 10 = best, 63 = worst; 12 is a good trade-off for YOLO at VGA
    -DLOCI_JPEG_QUALITY=12
    ; flip/mirror the sensor if the picture arrives upside down (0 or 1)
    -DLOCI_CAM_VFLIP=0
    -DLOCI_CAM_HMIRROR=0
    ; speaker: software gain applied to PCM before I2S (1.0 = as sent by the host)
    -DLOCI_SPK_GAIN=1.0f
    ; microphone: PDM mics are quiet, boost before upload
    -DLOCI_MIC_GAIN=6
    ; longest push-to-talk clip in seconds (buffered in PSRAM)
    -DLOCI_PTT_MAX_S=8

; ---------------------------------------------------------------------------
; Seeed Studio XIAO ESP32S3 Sense: OV2640 on the expansion board, PDM mic on
; GPIO41/42, 8 MB PSRAM. Speaker: MAX98357A on D0/D1/D2 (GPIO1/2/3) by default.
; Push-to-talk button: D3 (GPIO4) to GND.
; ---------------------------------------------------------------------------
[env:xiao_esp32s3_sense]
board = seeed_xiao_esp32s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -DLOCI_BOARD_XIAO_S3_SENSE
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; ---------------------------------------------------------------------------
; AI-Thinker ESP32-CAM: OV2640, 4 MB PSRAM, no mic, no USB — flash through a
; USB-serial adapter (IO0 to GND while resetting). Speaker: MAX98357A on
; GPIO14 (BCLK) / GPIO15 (LRC) / GPIO2 (DIN); button on GPIO13.
; ---------------------------------------------------------------------------
[env:esp32cam]
board = esp32cam
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DLOCI_BOARD_AI_THINKER
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; ---------------------------------------------------------------------------
; Freenove ESP32-S3 WROOM CAM (N8R8): OV2640/OV3660, 8 MB PSRAM, no mic.
; Speaker: MAX98357A on GPIO41 (BCLK) / GPIO42 (LRC) / GPIO1 (DIN); button GPIO21.
; ---------------------------------------------------------------------------
[env:freenove_esp32s3]
board = freenove_esp32_s3_wroom
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -DLOCI_BOARD_FREENOVE_S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
